<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horek Rokom Haat</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f6f8; }
    header { background: #2c3e50; color: white; text-align: center; padding: 20px; }
    .category-container { text-align: center; margin: 20px 0; }
    .category-btn { background: #fff; border: 1px solid #007bff; color: #007bff; padding: 8px 16px; margin: 4px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .category-btn.active { background: #007bff; color: white; }
    .products-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px; }
    .product-card { background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 220px; padding: 15px; position: relative; }
    .discount-badge { position: absolute; top: 10px; left: 10px; background: red; color: white; padding: 3px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
    .product-image { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
    .regular-price { text-decoration: line-through; color: #888; margin-right: 8px; }
    .sale-price { color: #27ae60; font-size: 18px; font-weight: bold; }
    .order-btn { display: block; background: #25D366; color: white; text-align: center; padding: 8px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>হরেক রকম হাট</h1>
    <p>আপনার নির্ভরযোগ্য অনলাইন স্টোর</p>
  </header>

  <div class="category-container" id="category-buttons"></div>
  <div id="product-list" class="products-container"><p>পণ্য লোড হচ্ছে...</p></div>

  <script>
    const sheetID = "19W0iW232jNJLDqPvtvtOYjmvNwrhuPOGkg75yX_BNUg";
    const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;
    let allProducts = [];
    const myPhoneNumber = "8801700000000"; // এখানে আপনার হোয়াটসঅ্যাপ ফোন নম্বর দিন

    fetch(url)
      .then(res => res.text())
      .then(data => {
        const json = JSON.parse(data.substring(47, data.length - 2));
        const rows = json.table.rows;

        allProducts = rows.map(row => ({
          title: row.c[0] ? row.c[0].v : '',
          category: row.c[1] ? row.c[1].v : 'অন্যান্য',
          regPrice: row.c[2] ? row.c[2].v : '',
          salePrice: row.c[3] ? row.c[3].v : '',
          discount: row.c[4] ? row.c[4].v : '',
          image: row.c[5] ? row.c[5].v : 'https://via.placeholder.com/200',
          desc: row.c[6] ? row.c[6].v : '',
          status: row.c[7] ? row.c[7].v : 'In Stock'
        }));

        setupCategories(allProducts);
        displayProducts(allProducts);
      });

    function setupCategories(products) {
      const categories = ['All', ...new Set(products.map(p => p.category).filter(Boolean))];
      const container = document.getElementById('category-buttons');
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `category-btn ${cat === 'All' ? 'active' : ''}`;
        btn.innerText = cat === 'All' ? 'সব পণ্য' : cat;
        btn.onclick = () => filterProducts(cat, btn);
        container.appendChild(btn);
      });
    }

    function displayProducts(products) {
      let output = '';
      products.forEach(item => {
        const whatsappMsg = encodeURIComponent(`হ্যালো! আমি অর্ডার করতে চাই:\nপণ্য: ${item.title}\nমূল্য: ৳${item.salePrice}`);
        const whatsappURL = `https://wa.me/${myPhoneNumber}?text=${whatsappMsg}`;

        output += `
          <div class="product-card">
            ${item.discount ? `<div class="discount-badge">${item.discount}</div>` : ''}
            <img src="${item.image}" class="product-image" onerror="this.src='https://via.placeholder.com/200'">
            <h4>${item.title}</h4>
            <p style="font-size: 12px; color: #666;">${item.desc}</p>
            <div>
              ${item.regPrice ? `<span class="regular-price">৳${item.regPrice}</span>` : ''}
              <span class="sale-price">৳${item.salePrice}</span>
            </div>
            <a href="${whatsappURL}" target="_blank" class="order-btn">অর্ডার করুন (WhatsApp)</a>
          </div>
        `;
      });
      document.getElementById('product-list').innerHTML = output;
    }

    function filterProducts(category, btnElement) {
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      displayProducts(category === 'All' ? allProducts : allProducts.filter(p => p.category === category));
    }
  </script>
</body>
</html>
